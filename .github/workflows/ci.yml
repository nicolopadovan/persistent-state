name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm turbo run typecheck lint test build
      - run: pnpm --filter @nicolopadovan/persistent-state exec playwright install --with-deps chromium-headless-shell
      - run: pnpm --filter @nicolopadovan/persistent-state test:browser
      - run: pnpm --filter @nicolopadovan/persistent-state check:package

  min-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: >-
          npm pkg set pnpm.overrides.react=18.3.0 pnpm.overrides.react-dom=18.3.0
          pnpm.overrides.@types/react=18.3.0 pnpm.overrides.@types/react-dom=18.3.0
          pnpm.overrides.next=15.0.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @nicolopadovan/persistent-state typecheck
      - run: pnpm --filter @nicolopadovan/persistent-state test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact -v'
