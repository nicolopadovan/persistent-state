name: Bug report
description: Something in persistent-state doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: '@nicolopadovan/persistent-state version'
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and version
      placeholder: Next.js 16.0.1
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Definition and options
      description: Your `persistentState()` definition and provider setup, without secrets.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: Include the storage kind and whether the consent predicate allowed storage.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal repository or the steps from a fresh page load.
    validations:
      required: true
